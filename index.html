<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>止鸣 AI - 息纷止讼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    
    <style>
        /* 2. 保留你原本的所有高级字体设置 */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        
        body {
            background-color: #fdfbf9;
            color: #334155;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Noto Sans SC', sans-serif;
            overflow-x: hidden;
        }

        /* 3. 保留你精心调配的渐变背景和卡片质感 */
        .warm-bg {
            background: linear-gradient(135deg, #fdfbf9 0%, #f5f7ff 100%);
        }

        .soft-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
        }

        .text-serif {
            font-family: 'Noto Serif SC', serif;
        }

        /* 4. 保留你设计的入场动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fadeIn {
            animation: fadeIn 0.4s ease-out forwards;
        }

        /* 5. 保留你极其专业的打印样式设置（对法律文书非常重要） */
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; padding: 0 !important; }
            #root { padding: 0 !important; }
            .warm-bg { background: white !important; }
            .printable { 
                background: white !important; 
                border: none !important; 
                box-shadow: none !important;
                padding: 0 !important;
                width: 100% !important;
                color: black !important;
                position: relative !important;
                display: block !important;
            }
            .printable * { color: black !important; }
        }
    </style>
</head>
<body class="warm-bg">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
</body>
</html>
